<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@300&display=swap" rel="stylesheet">
<style>
  body {
    background: linear-gradient(to right, #232526, #414345);
    color: #fff;
    font-family: 'Roboto', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    flex-direction: column;
    text-align: center;
  }

  .clock-container {
    perspective: 1000px;
  }

  .clock-flipper {
    position: relative;
    width: 400px;
    height: 250px;
    transform-style: preserve-3d;
    transition: transform 0.8s;
  }
  
  .clock-flipper.is-flipped {
    transform: rotateY(180deg);
  }

  .clock-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .analog-face {
    transform: rotateY(180deg);
  }

  #digital-clock {
    font-family: 'Orbitron', sans-serif;
    font-size: 4.5em;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
  }
  
  #date-display {
    font-size: 1.2em;
    margin-top: 10px;
    letter-spacing: 2px;
  }

  #analogClock {
    background: none;
  }

  .switch-container {
    margin-top: 30px;
    display: flex;
    align-items: center;
  }
  
  .switch-label {
    margin: 0 10px;
    font-size: 1em;
  }

  .toggle-switch {
    position: relative;
    display: inline-block;
    width: 60px;
    height: 34px;
  }

  .toggle-switch input { 
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    transition: .4s;
    border-radius: 34px;
  }

  .slider:before {
    position: absolute;
    content: "";
    height: 26px;
    width: 26px;
    left: 4px;
    bottom: 4px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
  }

  input:checked + .slider {
    background-color: #2196F3;
  }

  input:checked + .slider:before {
    transform: translateX(26px);
  }

</style>
</head>
<body>

<h1>Modern Clock</h1>

<div class="clock-container">
  <div id="clock-flipper" class="clock-flipper">
    <div class="clock-face digital-face">
      <div id="digital-clock"></div>
      <div id="date-display"></div>
    </div>
    <div class="clock-face analog-face">
      <canvas id="analogClock" width="250" height="250"></canvas>
    </div>
  </div>
</div>

<div class="switch-container">
  <span class="switch-label">Digital</span>
  <label class="toggle-switch">
    <input type="checkbox" id="mode-switch">
    <span class="slider"></span>
  </label>
  <span class="switch-label">Analog</span>
</div>

<script>
  const flipper = document.getElementById('clock-flipper');
  const modeSwitch = document.getElementById('mode-switch');
  let analogInterval = null;

  modeSwitch.addEventListener('change', function() {
    flipper.classList.toggle('is-flipped', this.checked);
    if (this.checked) {
      if (!analogInterval) {
        drawAnalogClock();
        analogInterval = setInterval(drawAnalogClock, 1000);
      }
    } else {
      if (analogInterval) {
        clearInterval(analogInterval);
        analogInterval = null;
      }
    }
  });

  function updateDigitalClock() {
    const now = new Date();
    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const seconds = now.getSeconds().toString().padStart(2, '0');
    
    document.getElementById('digital-clock').innerText = `${hours}:${minutes}:${seconds}`;

    const year = now.getFullYear();
    const month = (now.getMonth() + 1).toString().padStart(2, '0');
    const day = now.getDate().toString().padStart(2, '0');
    const dayOfWeek = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'][now.getDay()];

    document.getElementById('date-display').innerText = `${year}.${month}.${day} ${dayOfWeek}`;
  }

  setInterval(updateDigitalClock, 1000);
  updateDigitalClock();

  function drawAnalogClock() {
    const canvas = document.getElementById('analogClock');
    if (!canvas.getContext) return;
    const ctx = canvas.getContext('2d');
    const radius = canvas.height / 2;
    
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.translate(radius, radius);
    
    const drawingRadius = radius * 0.9;

    // Clock face
    ctx.beginPath();
    ctx.arc(0, 0, drawingRadius, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#fff';
    ctx.stroke();

    // Center circle
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.05, 0, 2 * Math.PI);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // Hour and minute marks
    for (let i = 0; i < 60; i++) {
        const ang = (i / 60) * 2 * Math.PI;
        const isHourMark = i % 5 === 0;
        const tickLength = isHourMark ? 0.1 : 0.05;
        const innerRadius = drawingRadius * (0.95 - tickLength);
        
        ctx.beginPath();
        ctx.moveTo(Math.sin(ang) * innerRadius, -Math.cos(ang) * innerRadius);
        ctx.lineTo(Math.sin(ang) * drawingRadius * 0.95, -Math.cos(ang) * drawingRadius * 0.95);
        ctx.strokeStyle = isHourMark ? '#fff' : '#ddd'; // Use a lighter gray for minutes
        ctx.lineWidth = isHourMark ? 2 : 1; // Make hour marks thicker
        ctx.stroke();
    }

    // Draw numbers
    ctx.font = (drawingRadius * 0.15) + "px Orbitron, sans-serif";
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for(let i = 1; i <= 12; i++){
        const angle = i * Math.PI / 6;
        const x = Math.sin(angle) * (drawingRadius * 0.78);
        const y = -Math.cos(angle) * (drawingRadius * 0.78);
        ctx.fillText(i.toString(), x, y);
    }
    
    const now = new Date();
    const hour = now.getHours();
    const minute = now.getMinutes();
    const second = now.getSeconds();

    // Hour hand
    let hourAngle = (hour % 12 + minute / 60) * (2 * Math.PI / 12);
    drawHand(ctx, hourAngle, drawingRadius * 0.5, 6, '#fff');
    
    // Minute hand
    let minuteAngle = (minute + second / 60) * (2 * Math.PI / 60);
    drawHand(ctx, minuteAngle, drawingRadius * 0.75, 4, '#fff');

    // Second hand
    let secondAngle = second * (2 * Math.PI / 60);
    drawHand(ctx, secondAngle, drawingRadius * 0.9, 2, '#f44336');
  }

  function drawHand(ctx, pos, length, width, color) {
    ctx.beginPath();
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.strokeStyle = color;
    ctx.moveTo(0,0);
    ctx.rotate(pos);
    ctx.lineTo(0, -length);
    ctx.stroke();
    ctx.rotate(-pos);
  }

</script>
</body>
</html>
